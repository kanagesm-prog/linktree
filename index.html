<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenny Sstar | Links</title>
    <style>
        :root {
            --text-main: #ffffff;
            --btn-text: #1d1d1f;
            --btn-bg: rgba(255, 255, 255, 0.85);
            --btn-hover: rgba(255, 255, 255, 1);
        }

        /* Vibrant animated gradient background */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(-45deg, #FF3CAC, #784BA0, #2B86C5, #FF9A9E);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 60px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .profile-name {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 12px 0;
            line-height: 1.2;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .profile-bio {
            font-size: 16px;
            font-weight: 400;
            margin: 0 0 40px 0;
            line-height: 1.6;
            max-width: 500px;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 1px 5px rgba(0,0,0,0.1);
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 64px;
            padding: 18px 24px;
            box-sizing: border-box;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            text-decoration: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            word-break: break-word;
        }

        .link-button:hover {
            background-color: var(--btn-hover);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
        }
        
    </style>
</head>
<body>
    <div class="container">
        
        <h1 class="profile-name">Kenny Sstar</h1>
        <p class="profile-bio">ICT Trainer and owner of VIRTUOTECH. Street photographer and graphic designer sharing my work and passion for education and creativity.</p>

        <div class="links-container">
            <a href="https://forms.gle/2kwFZsCSfGTdjGbaA" target="_blank" class="link-button">Borang Pendaftaran Kursus Cuti Sekolah - Membina Game Interactive</a>
            
            <a href="https://virtuotech.vercel.app/" target="_blank" class="link-button">Me and My Company VIRTUOTECH</a>
            
            <a href="https://wa.link/dkr26w" target="_blank" class="link-button">Keep in Touch With Me - Whatsapp</a>

            <a href="https://www.facebook.com/kenny.sstar.3" target="_blank" class="link-button">Follow Me in Facebook</a>
        </div>
    </div>
</body>
</html>
